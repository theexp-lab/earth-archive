<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="hero">

    <div class="topbar">
      <div>
        <p class="label">EARTH ARCHIVE</p>

      <div class="mission-info">
        <p class="label">MISSION EA-091</p>
        <p class="small">2091</p>
      </div>
    </div>

    <div class="hero-content">
      <p class="eyebrow">ARCHIVE ALLOCATION // PENDING</p>

      <h1>
        EARTH<br>
        ARCHIVE

      <p class="question">
        When preservation has a cost,<br>

      <button class="begin-button">

    </div>
